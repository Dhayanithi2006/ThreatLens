# ThreatLens Production NGINX Reverse Proxy Configuration
# Terminates TLS for remote Windows collectors & enforces request limits

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone for collector ingestion: 60 requests/minute per client IP
    limit_req_zone $binary_remote_addr zone=collector_ingest:10m rate=60r/m;

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name threatlens.local _;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen 443 ssl http2;
        server_name threatlens.local _;

        # SSL Certificates (Configure with enterprise CA or Let's Encrypt)
        ssl_certificate     /etc/ssl/certs/threatlens.crt;
        ssl_certificate_key /etc/ssl/private/threatlens.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Enforce 4MB max payload size (matches COLLECTOR_MAX_REQUEST_SIZE_BYTES)
        client_max_body_size 4M;

        # Hardened Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Ingestion API Route with Rate Limiting
        location /api/v1/collector/ingest/ {
            limit_req zone=collector_ingest burst=20 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # General API and Dashboard
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}

